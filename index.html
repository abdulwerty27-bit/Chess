{n:'Как ходят фигуры',s:[
{s:'Привет! Я твой тренер. Начнём с основ. В шахматах 64 клетки и по 16 фигур у каждой стороны. Побеждает тот, кто ставит <b>мат</b> королю соперника.',fen:START0},
{s:'<b>Пешка</b> ходит вперёд на одну клетку, а из начальной позиции может на две. Бьёт по диагонали вперёд. Сходи пешкой e2–e4.',fen:START0,ok:[['e2','e4'],['d2','d4']]},
{s:'<b>Конь</b> ходит буквой «Г» и единственный перепрыгивает через фигуры. Выведи коня: g1–f3.',fen:E4E5,ok:[['g1','f3'],['b1','c3']]},
{s:'<b>Слон</b> ходит по диагонали на любое число клеток, всегда по клеткам одного цвета. Поставь слона на c4 — он смотрит на слабый пункт f7.',fen:'r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq -',ok:[['f1','c4'],['f1','b5']]},
{s:'<b>Король</b> ходит на одну клетку. Чтобы спрятать его, делают <b>рокировку</b>: король и ладья прыгают одновременно. Сделай короткую рокировку: король e1–g1.',fen:'r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq -',ok:[['e1','g1']]},
{s:'<b>Ладья</b> ходит по прямым линиям, <b>ферзь</b> — и по прямым, и по диагоналям, это самая сильная фигура. Поставь ладью на a8 — шах королю!',fen:'4k3/8/8/8/8/8/8/R3K3 w - -',ok:[['a1','a8']]},
{s:'<b>Урок пройден!</b> Ты знаешь, как ходят все фигуры. Дальше учим идеи, а не просто ходы.'}]},
{n:'Три правила дебюта',s:[
{s:'В начале партии держись трёх правил: <b>1)</b> займи центр пешками, <b>2)</b> выводи коней и слонов, <b>3)</b> рано сделай рокировку. Не ходи одной фигурой дважды без нужды и не выводи ферзя слишком рано.',fen:START0},
{s:'Правило 1. Займи центр пешкой: e2–e4 или d2–d4.',fen:START0,ok:[['e2','e4'],['d2','d4']]},
{s:'Правило 2. Развивай фигуры: выведи коня или слона на активную клетку.',fen:E4E5,ok:[['g1','f3'],['b1','c3'],['f1','c4'],['f1','b5']]},
{s:'Ранний ход ферзём — ошибка: его начнут гонять. Сыграй за чёрных: выведи коня с атакой на ферзя или с защитой пешки e5.',fen:'rnbqkbnr/pppp1ppp/8/4p2Q/4P3/8/PPPP1PPP/RNB1KBNR b KQkq -',ok:[['b8','c6'],['g8','f6']]},
{s:'<b>Урок пройден!</b> Центр, развитие, рокировка — этого хватит, чтобы пережить дебют. Загляни в режим «Дебюты»: там 15 готовых линий.'}]},
{n:'Ценность фигур и размены',s:[
{s:'У фигур есть «цена»: пешка — 1, конь — 3, слон — 3, ладья — 5, ферзь — 9. Меняй равное на равное, когда ты впереди; не отдавай ладью за пешку; не променивай ферзя на фигуру.'},
{s:'Найди ход, который выигрывает материал. Сначала посмотри, что ты берёшь и чем ответит соперник.',pz:'win',k:0},
{s:'Ещё одна. Посчитай: взятие должно приносить больше, чем стоит в ответ.',pz:'win',k:1},
{s:'И третья. Ищи беззащитные фигуры и двойные удары.',pz:'win',k:2},
{s:'<b>Урок пройден!</b> Теперь ты считаешь «цену» каждого размена.'}]},
{n:'Метод кандидатов: Ш-В-У',s:[
{s:'Перед ходом проверяй по порядку: <b>Ш</b>ахи, <b>В</b>зятия, <b>У</b>грозы — свои и соперника. Так выбор сужается до 2–3 «кандидатов», и ты не пропускаешь сильные ходы.'},
{s:'Начни с шахов: есть ли мат в один ход?',pz:'m1',k:0},
{s:'Снова шахи. Проверь все — найди мат.',pz:'m1',k:1},
{s:'Теперь взятия. Найди ход, который выигрывает материал.',pz:'win',k:3},
{s:'Угрозы соперника! Ему грозит мат — защитись, но так, чтобы не подставить ничего другого.',pz:'def',k:0},

function saveGame(msg){if(hist.length<2||pz||ls||vis||rv||op||eg)return;cfg.games=cfg.games||[];cfg.games.unshift({t:Date.now(),mode:cfg.mode,me,solo:!!solo,res:msg,moves:hist.map(h=>[h.m.f,h.m.t,h.m.pr||''])});cfg.games=cfg.games.slice(0,30);save()}
function analyzeCurrent(){if(!hist.length)return;reviewStart({moves:hist.map(h=>[h.m.f,h.m.t,h.m.pr||'']),me})}
function reviewStart(g){resetModes();rv={g};S=init();keys=[key(S)];for(const x of g.moves){const m=legal(S).find(y=>y.f==x[0]&&y.t==x[1]&&(y.pr||'')==(x[2]||''));if(!m)break;const n=san(S,m),nx=make(S,m);hist.push({s:S,m,n,c:null,by:S.t});S=nx;keys.push(key(S))}
me=g.me||'w';flip=me=='b';lm=hist.length?hist[hist.length-1].m:null;over='Разбор партии';say('Открываю партию…');render();analyzeAll()}
async function analyzeAll(){const R=rv,N=hist.length;busy=true;for(let i=0;i<N&&rv===R;i++){await new Promise(r=>setTimeout(r,12));if(rv!==R)return;const h=hist[i],c=cls(h.s,h.m,i+1<N?hist[i+1].s:S);Object.assign(h,{c:c.k,loss:c.loss,uv:c.uv,best:c.best,bv:c.bv});if(i%2==0){side();say(`Анализирую партию… ${i+1}/${N}`)}}
if(rv===R){busy=false;side();revSummary()}}
function revSummary(){const acc=c=>{const L=hist.filter(h=>h.by==c&&h.c);if(!L.length)return'—';return Math.max(0,Math.round(100-L.reduce((s,h)=>s+h.loss,0)/L.length/3))+'%'},cnt=k=>hist.filter(h=>h.c==k).length;
say(`<b>Разбор готов.</b> Точность: белые ${acc('w')}, чёрные ${acc('b')}. Блестящих: ${cnt('brill')}, ошибок: ${cnt('mist')}, зевков: ${cnt('blun')}.<br>Нажми на ход в списке — объясню, почему он такой.`,0,0,0,[['К ошибке',()=>{const i=hist.findIndex(h=>h.c=='blun'||h.c=='mist');if(i>=0){vw=i+1;render();moveInfo(i)}}]])}
function moveInfo(i){const h=hist[i];if(!h)return;if(!h.c)return say('Этот ход ещё не проанализирован — подожди секунду.');
say(explainMove(h.s,h.m,h.c,{loss:h.loss,best:h.best,uv:h.uv}),h.c,0,0,[['Лучший ход',()=>showPV(h.s,h.best,6,'Лучше было:')],['Как пошло',()=>showPV(h.s,h.m,6,'Было так:')]])}
function selfBody(){return'<h3>Сам с собой</h3><p style="color:#bababa">Ходи за обе стороны: удобно разбирать позиции и играть вдвоём на одном телефоне. Тренер оценивает ходы, после партии доступен разбор с объяснениями.</p>'}
function gamesList(){const G=cfg.games||[];if(!G.length)return'<h3>Мои партии</h3><p style="color:#bababa">Здесь появятся сыгранные партии для разбора. Сыграй хотя бы одну.</p>';
return`<h3>Мои партии · ${G.length}</h3><p style="color:#bababa;font-size:13px;margin:0 0 8px">Нажми на партию — тренер разберёт каждый ход.</p><div>${G.map((g,i)=>`<div class="lv" data-gm="${i}"><span>${new Date(g.t).toLocaleDateString('ru-RU')} · ${MODES[g.mode]||'Партия'}<br><small style="letter-spacing:0">${g.res||''}</small></span><i>${g.moves.length} ходов</i></div>`).join('')}</div>`}
function threatArrows(){const out=[];if(!(cfg.thr||cfg.thr2)||over||vw!=null||pvv||vis||ls&&!pz||!S.b.some(Boolean))return out;
const X=online||!solo?me:S.t,O=opp(X),val=p=>V[p[1]];
const scan=(att,def,col,w)=>{const s2=Object.assign({},S,{t:att,ep:-1});for(const m of gen(s2)){const tg=S.b[m.t];if(!tg||tg[0]!=def)continue;const pc=S.b[m.f],defended=att0(S.b,m.t,def);if(!defended||V[tg[1]]>V[pc[1]])out.push({f:m.f,t:m.t,c:col,w,sq:m.t})}};
if(cfg.thr)scan(O,X,'#e53935',.12);if(cfg.thr2)scan(X,O,'#2e9e4f',.1);
if(cfg.thr&&S.t==X){const s2=Object.assign({},S,{t:O,ep:-1});try{for(const m of legal(s2))if(isMate(make(s2,m))){out.push({f:m.f,t:m.t,c:'#b71c1c',w:.16,sq:m.t});break}}catch(e){}}
return out}
const att0=(b,sq,by)=>att(b,sq,by);
function drawRender(){const el=$('#dw');if(!el)return;const fx=x=>flip?8-x:x,fy=y=>flip?8-y:y,cx=i=>fx((i&7)+.5),cy=i=>fy((i>>3)+.5);let h='';
const arrow=(f,t,c,w,o)=>{if(f==t)return`<circle cx="${cx(f)}" cy="${cy(f)}" r=".44" fill="none" stroke="${c}" stroke-width="${Math.max(.06,w*.6)}" opacity="${o||.85}"/>`;const x1=cx(f),y1=cy(f),x2=cx(t),y2=cy(t),dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,hl=Math.min(w*3.2,L*.6),hw=w*1.9,bx=x2-ux*hl,by=y2-uy*hl;
return`<g opacity="${o||.85}"><line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><polygon points="${x2},${y2} ${bx-uy*hw},${by+ux*hw} ${bx+uy*hw},${by-ux*hw}" fill="${c}"/></g>`};
for(const th of threatArrows())h+=arrow(th.f,th.t,th.c,th.w,.72)+`<circle cx="${cx(th.sq)}" cy="${cy(th.sq)}" r=".47" fill="none" stroke="${th.c}" stroke-width=".06" opacity=".8"/>`;
for(const d of drw.concat(dcur?[dcur]:[])){if(d.k=='a')h+=arrow(d.f,d.t,d.c,d.w);else if(d.pts&&d.pts.length>1)h+=`<polyline points="${d.pts.map(p=>fx(p[0])+','+fy(p[1])).join(' ')}" fill="none" stroke="${d.c}" stroke-width="${d.w}" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`}
el.innerHTML=h}
const dwid=()=>.05+(cfg.dw||3)*.04;
function bpos(e){const r=$('#bd').getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*8,y:(e.clientY-r.top)/r.height*8}}
function sqAt(p){const c=Math.max(0,Math.min(7,Math.floor(p.x))),r=Math.max(0,Math.min(7,Math.floor(p.y)));return(flip?7-r:r)*8+(flip?7-c:c)}
function dDown(e){const p=bpos(e);if(dmode=='free')dcur={k:'p',c:cfg.dc,w:dwid(),pts:[[flip?8-p.x:p.x,flip?8-p.y:p.y]]};else{const i=sqAt(p);dcur={k:'a',f:i,t:i,c:cfg.dc,w:dwid()}}try{bdE.setPointerCapture(e.pointerId)}catch(x){}drawRender()}
function dMove(e){const p=bpos(e);if(dcur.k=='p')dcur.pts.push([flip?8-p.x:p.x,flip?8-p.y:p.y]);else dcur.t=sqAt(p);drawRender()}
function dUp(){if(dcur){if(dcur.k=='a'||dcur.pts.length>1)drw.push(dcur);dcur=null;drawRender()}}

$('#dwr').oninput=e=>{cfg.dw=+e.target.value;save()};$('#dun').onclick=()=>{drw.pop();drawRender()};$('#dcl').onclick=()=>{drw=[];drawRender()};$('#dcx').onclick=()=>{p.hidden=true}}
(function(){const pen=$('#pen');let st=null;const pos=cfg.pen||{x:innerWidth-64,y:innerHeight*.55};const put=()=>{pen.style.left=Math.max(4,Math.min(innerWidth-52,pos.x))+'px';pen.style.top=Math.max(4,Math.min(innerHeight-52,pos.y))+'px'};put();pen.title='Режим игры — нажми, чтобы рисовать';
pen.onpointerdown=e=>{st={x:e.clientX,y:e.clientY,ox:pos.x,oy:pos.y,m:0};pen.setPointerCapture(e.pointerId)};
pen.onpointermove=e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;if(Math.hypot(dx,dy)>6)st.m=1;if(st.m){pos.x=st.ox+dx;pos.y=st.oy+dy;put()}};

${cfg.mode>=3?'':`<h3>Играть за</h3><div class="ch" data-g="s">${[['Белые','w'],['Случайно','r'],['Чёрные','b']].map(a=>`<button class="${cfg.side==a[1]?'on':''}" data-s="${a[1]}">${a[0]}</button>`).join('')}</div>
<h3>Время</h3><div class="ch" data-g="t">${TCS.map((a,i)=>`<button class="${cfg.tc==i?'on':''}" data-t="${i}">${a[0]}</button>`).join('')}</div>`}
<button class="go" id="go">${GOL[cfg.mode]||'Начать партию'}</button></div>`;

else if(b.dataset.fi){const code='f'+Math.random().toString(36).slice(2,8);if(pws&&pws.readyState==1)pws.send(JSON.stringify({tp:'invite',to:b.dataset.fi,code,nick:cfg.nick||'Игрок'}));cfg.code=code;save();startGame()}
else if(b.dataset.pz!=null){pzStart(+b.dataset.pz)}else if(b.dataset.bot!=null){selBot(+b.dataset.bot,b)}else if(b.dataset.gm!=null){reviewStart(cfg.games[+b.dataset.gm])}else if(b.dataset.ls!=null){lsStart(+b.dataset.ls)}else if(b.dataset.eg!=null){cfg.eg=+b.dataset.eg;save();one(b,'.lv')}else if(b.dataset.op!=null){cfg.op=+b.dataset.op;save();one(b,'.lv')}else if(b.dataset.er!=null){cfg.err=+b.dataset.er;save();one(b,'button')}
